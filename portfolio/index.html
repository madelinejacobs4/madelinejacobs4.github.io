<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maddie Jacobs – Projects</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: url('../portfolio.jpeg') center/cover no-repeat fixed;
      color: #333;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 0;
    }

    nav {
      display: flex;
      justify-content: flex-start;
      padding: 20px 40px;
      background: rgba(139, 0, 0, 0.85);
      position: fixed;
      width: 100%;
      z-index: 1;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: 700;
      margin-right: 30px;
      padding: 10px 15px;
      border-radius: 4px;
      transition: background 0.3s;
    }

    nav a:hover {
      background: rgba(139, 0, 0, 0.85);
    }

    nav a.active {
      background: rgba(255,255,255,0.3);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
      padding: 140px 20px 40px;
      max-width: 1200px;
      margin: auto;
      position: relative;
      z-index: 1;
    }

    .project {
      position: relative;
      background: #fff;
      aspect-ratio: 1/1;
      border-radius: 15px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .project:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 18px rgba(0,0,0,0.2);
    }

    .project img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s, filter 0.4s;
    }

    .project:hover img {
      transform: scale(1.05);
      filter: brightness(0.6) sepia(1) hue-rotate(-10deg) saturate(6);
    }

    .project-name {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(139, 0, 0, 0.85);
      color: #fff;
      font-size: 1.5rem;
      font-weight: 600;
      text-align: center;
      opacity: 0;
      transition: opacity 0.4s;
    }

    .project:hover .project-name { opacity: 1; }

    @media (max-width: 768px) {
      nav { justify-content: space-around; padding: 15px 20px; }
      .grid { padding: 160px 10px 20px; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="../about.html" class="nav-link">About</a>
    <a href="index.html" class="nav-link">Projects</a>
  </nav>

  <div class="grid">
    <div class="project" data-project="fliers">
      <img src="Baadsunday.JPG" alt="Fliers">
      <div class="project-name">Fliers</div>
    </div>
    <div class="project" data-project="soulbones">
      <img src="S&B.jpg" alt="Soul & Bones">
      <div class="project-name">Soul & Bones</div>
    </div>
    <div class="project" data-project="multimedia">
      <img src="boyslie.jpg" alt="Multimedia">
      <div class="project-name">Multimedia Design</div>
    </div>
  </div>

  <script>
    // Highlight current nav link dynamically
    const links = document.querySelectorAll('.nav-link');
    links.forEach(link => {
      if (link.href === window.location.href) {
        link.classList.add('active');
      }
    });
  </script>
</body>
</html>
